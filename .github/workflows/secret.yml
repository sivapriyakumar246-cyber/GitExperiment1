name: Use API Key

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  secret-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Use secret safely
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "API secret is configured and available."
          else
            echo "API secret is missing."
            exit 1
          fi