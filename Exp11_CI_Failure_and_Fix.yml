EXPERIMENT NO. 11

ANALYZE AND FIX FAILING CI WORKFLOWS

AIM

To identify, analyze, and fix errors in a failing Continuous Integration (CI) workflow using GitHub Actions.

SOFTWARE REQUIREMENTS

1. GitHub account
2. GitHub repository
3. Web browser
4. GitHub Actions

PROCEDURE

Step 1: Create a GitHub Repository

Create a repository named "GitExperiment1" on GitHub.

Step 2: Create a Workflow File

Open the repository and navigate to ".github/workflows/". Create a new file named "ci-fix demo.yml".

Step 3: Configure the Workflow

Write YAML code to execute the workflow whenever changes are pushed to the "main" branch.

Step 4: Add the Checkout Step

Use "actions/checkout@v4" to access the repository files in the GitHub Actions runner.

Step 5: Add a Test Command

Add "python --version" to check the installed Python version.

Step 6: Introduce an Error

Add the command "exit 1" to intentionally make the workflow fail.

Step 7: Commit the Code

Save and commit the workflow file to the "main" branch.

Step 8: Execute the Workflow

Open the repository's Actions tab and select "CI Failure and Fix Demo".

Step 9: Analyze the Failure

Open the failed workflow run and inspect the error logs. Identify the message "Process completed with exit code 1".

Step 10: Fix the Error

Edit "ci-fix demo.yml" and remove the "exit 1" command. Add a success message to the test step.

Step 11: Commit the Fixed Code

Commit the updated workflow file to trigger another workflow run.

Step 12: Verify the Workflow

Open the Actions tab and confirm that the latest workflow run completes successfully with a green tick.

---

PROGRAM

Part A: Workflow with an Intentional Failure

File name: "ci-fix demo.yml"

Location: ".github/workflows/ci-fix demo.yml"

name: CI Failure and Fix Demo

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run test command
        run: |
          echo "Starting CI test"
          python --version

      - name: Intentional failure for testing
        run: exit 1

Expected output:

The workflow fails at the "Intentional failure for testing" step.

Error message:

"Process completed with exit code 1"

Part B: Fixed CI Workflow

File name: "ci-fix demo.yml"

Replace the previous code with the following corrected code:

name: CI Failure and Fix Demo

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run test command
        run: |
          echo "Starting CI test"
          python --version
          echo "CI test completed successfully"

Expected output:

Starting CI test
Python 3.x.x
CI test completed successfully

Note: The exact Python version may differ.

The workflow should complete successfully and display a green tick in the Actions tab.

---

EXECUTION STEPS

1. Open the "GitExperiment1" repository.
2. Navigate to ".github/workflows/".
3. Open "ci-fix demo.yml".
4. Paste the Part A code and commit the changes.
5. Open the Actions tab and select the latest workflow run.
6. Click the "test" job and inspect the failed step.
7. Identify the error message "Process completed with exit code 1".
8. Edit "ci-fix demo.yml" and replace the Part A code with the Part B code.
9. Commit the corrected code.
10. Open the Actions tab again.
11. Verify that the latest workflow run completes successfully with a green tick.

RESULT

The failing CI workflow was analyzed, the error was identified and corrected, and the workflow was executed successfully using GitHub Actions.
